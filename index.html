<!DOCTYPE html>  
<html lang="zh-CN">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">  
<title>夜莺账簿</title>  
<style>  
:root{--ink:#1a1a2e;--paper:#faf6ee;--line:#1a1a2e;--gold:#b58c52;--red:#c62828;--green:#6f9e6f;--shadow:5px 5px 0 rgba(26,26,46,.9)}  
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}  
body{font-family:"Courier New","PingFang SC",sans-serif;background:linear-gradient(135deg,#d9cdbb,#efe7da);display:flex;justify-content:center;min-height:100vh;color:var(--ink)}  
.app{width:100%;max-width:460px;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);box-shadow:0 0 40px rgba(0,0,0,.25);border-left:2px solid var(--line);border-right:2px solid var(--line);position:relative}  
.hd{padding:14px 14px 10px;background:var(--ink);color:#fff;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:50}  
.row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}  
h1{font-size:17px;letter-spacing:2px;color:var(--gold)}.by{font-size:10px;color:#b58c52;margin-left:6px}.sub{font-size:10px;color:#bbb}  
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}  
.tg{background:#2a2a40;border:1px solid #4a4a60;color:#eee;padding:3px 8px;font-size:10px;font-weight:bold;border-radius:3px}  
.cr{background:var(--red);border-color:#ff6b6b;color:#fff}  
.debtbar{display:flex;align-items:center;gap:8px;font-size:10px}.lb{color:#f0d9a0;white-space:nowrap}  
.db{flex:1;height:12px;background:#0e0e1a;border:1px solid #4a4a60;border-radius:6px;overflow:hidden}  
.df{height:100%;background:linear-gradient(90deg,var(--red),#e57373);transition:width .4s}  
.rt{color:#ffb4a2;white-space:nowrap}  
.mn{flex:1;padding:14px;overflow-y:auto;padding-bottom:150px}  
.lc{background:#fff;border:2px solid var(--line);padding:14px;box-shadow:var(--shadow);margin-bottom:14px;height:210px;display:flex;flex-direction:column}  
.lc h2{font-size:13px;border-bottom:2px dashed var(--line);padding-bottom:8px;margin-bottom:10px;color:var(--gold)}  
#log{flex:1;overflow-y:auto}#log p{font-size:12px;line-height:1.7;margin-bottom:5px;color:#555;border-left:2px solid #ddd;padding-left:6px}  
.gd{color:var(--gold);font-weight:bold}.rd{color:var(--red);font-weight:bold}.gy{color:#777}  
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}  
.ac{background:#fff;border:2px solid var(--line);padding:13px;display:flex;gap:10px;box-shadow:4px 4px 0 rgba(26,26,46,.8);cursor:pointer;transition:.08s}  
.ac:active{transform:translate(4px,4px);box-shadow:none}  
.ac.tr{background:#ccc;opacity:.55;pointer-events:none}  
.aci{font-size:22px}.aci2{flex:1;min-width:0}  
.act{font-size:13px;font-weight:bold;margin-bottom:4px;display:flex;gap:6px;flex-wrap:wrap}  
.acd{font-size:10px;color:#777;margin-bottom:5px}.acc{font-size:10px;color:var(--green);font-weight:bold}  
.em{display:inline-block;border:1px solid;padding:0 5px;font-size:9px;border-radius:8px}  
.bt{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;background:var(--paper);border-top:3px solid var(--line);z-index:50}  
.bn{display:flex;justify-content:space-around;padding:7px 0;border-bottom:1px solid #ccc}  
.nb{background:none;border:none;display:flex;flex-direction:column;align-items:center;font-size:10px;color:#999;width:16.6%;font-weight:bold}  
.nb .ic{font-size:16px;margin-bottom:2px}.nb.a{color:var(--ink)}  
.ba{display:flex;gap:8px;padding:9px 12px 13px}  
.bn2{flex:1;border:2px solid var(--line);font-weight:bold;font-size:12px;padding:12px 0;background:#fff;box-shadow:3px 3px 0 var(--line);cursor:pointer}  
.bn2:active{transform:translate(3px,3px);box-shadow:none}.be{background:var(--ink);color:#fff;border-color:#000}  
.mo{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:999;display:none;justify-content:center;align-items:center;padding:20px}  
.mo.s{display:flex}  
.mb{background:var(--paper);border:2px solid var(--line);width:100%;max-width:380px;max-height:85vh;overflow-y:auto;padding:20px;box-shadow:8px 8px 0 var(--line);position:relative}  
.mt{font-size:16px;font-weight:bold;margin-bottom:14px;text-align:center;border-bottom:2px solid var(--line);padding-bottom:11px;color:var(--gold)}  
.mc{position:absolute;top:13px;right:18px;font-size:20px;cursor:pointer;font-weight:bold;color:#999}  
.mbl{display:flex;flex-direction:column;gap:9px;margin-top:10px}  
.mb2{background:#fff;border:2px solid var(--line);padding:12px;font-size:12.5px;text-align:center;cursor:pointer;font-weight:bold;box-shadow:3px 3px 0 var(--line)}  
.mb2:active{transform:translate(3px,3px);box-shadow:none}  
.mb2.p{background:var(--ink);color:#fff}.mb2.d{background:var(--red);color:#fff;border-color:#7f1d1d}.mb2.g{background:var(--gold);color:#1a1a2e}  
.sr{display:flex;align-items:center;margin-bottom:10px;font-size:11px}.sl{width:52px;font-weight:bold}  
.sb{flex:1;height:10px;background:#fff;border:1px solid var(--line);overflow:hidden;margin:0 8px;border-radius:5px}  
.sf{height:100%;border-radius:5px}.sv{width:30px;text-align:right;font-weight:bold}  
.ib{width:100%;padding:13px;border:2px solid var(--line);font-size:14px;margin-top:10px;text-align:center;background:#fff;outline:none;font-family:monospace}  
.stc{max-height:50vh;overflow-y:auto;font-size:13px;line-height:2;padding-right:8px;margin-bottom:12px}  
.stc p{margin-bottom:8px;text-indent:2em;color:#333}.stc p:first-child{text-indent:0}  
textarea.ta{width:100%;min-height:90px;border:2px solid var(--line);font-size:11px;font-family:monospace;padding:8px;background:#fff;resize:vertical}  
.slot{display:flex;justify-content:space-between;align-items:center;background:#fff;border:2px solid var(--line);padding:10px 12px;box-shadow:3px 3px 0 var(--line)}  
.slot .sn{font-weight:bold;font-size:12px}.slot .sd{font-size:10px;color:#888;margin-top:3px}.slot .sa{display:flex;gap:6px}  
.sbtn{border:1.5px solid var(--line);background:#fff;font-size:11px;font-weight:bold;padding:6px 9px;cursor:pointer}  
.sbtn.p{background:var(--ink);color:#fff}.sbtn.d{color:var(--red)}  
/* 病娇特效 */  
.flash-screen{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,0,0,0.95);z-index:999999;overflow:hidden;display:none}  
.flash-text{position:absolute;color:#ff0000;font-weight:900;white-space:nowrap;font-family:"Courier New",monospace;animation:crazyJump 0.15s infinite alternate,crazyBlink 0.1s infinite;text-shadow:0 0 10px #ff0000,0 0 20px #ff0000}  
@keyframes crazyJump{from{transform:translateY(0) scale(1)}to{transform:translateY(-15px) scale(1.1)}}  
@keyframes crazyBlink{0%,100%{opacity:1}50%{opacity:0.1}}  
</style>  
</head>  
<body>  
<div class="app">  
  <div class="hd">  
    <div class="row1"><div><h1>NIGHTINGALE 夜莺账簿<span class="by">by Rain</span></h1><div class="sub">日本 · 霓虹街 · 牛郎俱乐部</div></div><span class="tg" id="lt">⭐</span></div>  
    <div class="tags"><span class="tg" id="tt">第1年 3月 上旬</span><span class="tg" id="st">春季</span><span class="tg" id="ht2">人气 0</span><span class="tg" id="rt">口碑 0</span><span class="tg" id="lq">酒水 20</span><span class="tg" id="hl">健康 100</span><span class="tg" id="ct">现金 500万</span><span class="tg" id="at">行动 7/7</span></div>  
    <div class="debtbar"><span class="lb" id="dbt">负债 5000万</span><div class="db"><div class="df" id="dfill" style="width:100%"></div></div><span class="rt" id="dl">期限 剩18旬</span></div>  
  </div>  
  <div class="mn" id="mn"><div class="lc" id="lc"><h2>📜 事迹记录</h2><div id="log"></div></div><div class="grid" id="tab"></div></div>  
  <div class="bt">  
    <div class="bn" id="bn">  
      <button class="nb a" data-tab="home"><span class="ic">🏠</span>首页</button><button class="nb" data-tab="staff"><span class="ic">👥</span>牛郎</button><button class="nb" data-tab="shop"><span class="ic">🍾</span>经营</button><button class="nb" data-tab="market"><span class="ic">🌆</span>街道</button><button class="nb" data-tab="logs"><span class="ic">📖</span>日志</button><button class="nb" data-tab="stats"><span class="ic">📊</span>属性</button>  
    </div>  
    <div class="ba"><button class="bn2 be" id="be">⏳ 结束本旬</button><button class="bn2" id="bs">💾 存档</button><button class="bn2" id="br">🔄 重开</button></div>  
  </div>  
</div>  
<div class="mo" id="mo"><div class="mb"><span class="mc" id="mc">✕</span><h3 class="mt" id="mt2">提示</h3><div id="mc2"></div></div></div>  
  
<script>  
var $=function(id){return document.getElementById(id);};  
var NP=["尼古拉斯","亚历克斯","藤原","佐藤","卢卡","威廉","詹姆斯","李","金","木村","宋","朴","安德烈","马特奥","提莫西"],PP=["温柔","偏执","傲娇","病娇","理性","白切黑","狼狗","谋士","笑面疯批","桀骜不驯"],NAP=["日本","韩国","法国","意大利","美国","英国","德国","俄罗斯","西班牙","混血"];  
var rN=function(){var n=NP[Math.floor(Math.random()*NP.length)],a=0;while(st.staff.some(function(s){return s.name===n;})&&a++<60)n=NP[Math.floor(Math.random()*NP.length)];return n;};  
var rNat=function(){return NAP[Math.floor(Math.random()*NAP.length)];},rPer=function(){return PP[Math.floor(Math.random()*PP.length)];};  
var rnd=function(arr){return arr[Math.floor(Math.random()*arr.length)];};  
var EX_PER=["偏执","病娇","狼狗","白切黑"][Math.floor(Math.random()*4)];  
  
var st={playerName:"",playerPersonality:"",date:"第1年 3月 上旬",season:"春季",shopLevel:1,shopLevelName:"⭐",heat:0,reputation:0,liquor:20,health:100,consecutiveActions:0,hasRested:false,weekCount:1,noRestWeeks:0,exploreCount:0,cash:500,debt:5000,interestRate:0.02,deadlineWeek:18,ap:7,maxAp:7,tab:"home",npc:null,staff:[],gameOver:false,prologueDone:false,storyPlayed:[],weekActions:[],_lastActs:[],flags:{},creditor:"金爷"};  
var exBF=function(){return st.staff.find(function(s){return s.role==="前男友";});};  
  
function initStaff(){  
  st.staff=[  
    {id:"s1",name:rN(),role:"前男友",age:21,nationality:"日本",personality:EX_PER,face:98,ability:85,favor:90,loyalty:95,mental:15,obsession:30,status:"在岗",desc:"你的前男友。为你放下一切来到店里，眼神永远追随着你。",puaCount:0,money:500,diary:[],lastSought:-1,diaryCount:0},  
    {id:"s2",name:rN(),role:"普通员工",age:22,nationality:rNat(),personality:rPer(),face:75,ability:60,favor:40,loyalty:30,mental:0,obsession:0,status:"在岗",desc:"略显懒散，但对你有那么一点说不清的心思。",puaCount:0,money:200,diary:[],lastSought:-1,diaryCount:0},  
    {id:"s3",name:rN(),role:"普通员工",age:19,nationality:rNat(),personality:rPer(),face:82,ability:78,favor:55,loyalty:65,mental:0,obsession:0,status:"在岗",desc:"新人里最有潜力的一位，看你的眼神日渐发亮。",puaCount:0,money:300,diary:[],lastSought:-1,diaryCount:0}  
  ];  
}  
function norm(){  
  st.staff=(Array.isArray(st.staff)?st.staff:[]).map(function(s){s.favor=+s.favor||0;s.loyalty=+s.loyalty||0;s.face=+s.face||50;s.ability=+s.ability||50;s.mental=+s.mental||0;s.obsession=+s.obsession||0;s.money=+s.money||0;s.puaCount=+s.puaCount||0;s.age=+s.age||20;s.diary=s.diary||[];s.lastSought=s.lastSought||-1;s.diaryCount=+s.diaryCount||0;if(!s.status)s.status="在岗";if(!s.name)s.name=rN();if(!s.role)s.role="普通员工";return s;});  
  var def={cash:500,debt:5000,health:100,ap:7,maxAp:7,weekCount:1,heat:0,reputation:0,liquor:20,shopLevel:1,deadlineWeek:18,interestRate:0.02,exploreCount:0,noRestWeeks:0};  
  for(var k in def){if(isNaN(+st[k]))st[k]=def[k];}  
  st.weekActions=st.weekActions||[];st.storyPlayed=st.storyPlayed||[];st._lastActs=st._lastActs||[];st.flags=st.flags||{};if(!st.tab)st.tab="home";  
}  
var emo=function(s){return s.mental>=80?{t:"崩溃边缘",c:"#c62828"}:s.favor>=100?{t:"痴狂",c:"#c62828"}:s.favor>=85?{t:"痴迷",c:"#b58c52"}:s.favor>=65?{t:"心动",c:"#e07a5f"}:s.favor>=45?{t:"依恋",c:"#e8a87c"}:s.loyalty<25?{t:"疏远",c:"#999"}:{t:"平静",c:"#6f9e6f"};};  
var emoB=function(s){var e=emo(s);return '<span class="em" style="color:'+e.c+';border-color:'+e.c+'">'+e.t+'</span>';};  
var mem=function(s,txt){s.diary=s.diary||[];s.diary.unshift(st.date+" "+txt);if(s.diary.length>20)s.diary.pop();};  
var fill=function(t){if(t==null)return "";var ex=exBF(),top=st.staff.slice().sort(function(a,b){return b.favor-a.favor;})[0];return String(t).replace(/\{p\}/g,st.playerName).replace(/\{ex\}/g,ex?ex.name:"承欢").replace(/\{cr\}/g,st.creditor).replace(/\{emp\}/g,top?top.name:"员工").replace(/\{debt\}/g,st.debt).replace(/\{cash\}/g,st.cash);};  
var om=function(t,h){$("mt2").innerText=t;$("mc2").innerHTML=h;$("mo").classList.add("s");},cm=function(){$("mo").classList.remove("s");};  
var bar=function(l,v,c){return '<div class="sr"><span class="sl">'+l+'</span><div class="sb"><div class="sf" style="width:'+Math.min(100,Math.max(0,v))+'%;background:'+c+'"></div></div><span class="sv">'+Math.round(v)+'</span></div>';};  
var log=function(t,c){var la=$("log");if(!la)return;var p=document.createElement("p");p.className=c||"gy";p.innerText=t;la.appendChild(p);la.scrollTop=la.scrollHeight;};  
function toast(m,e){var t=document.createElement("div");t.innerText=m;t.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1a1a2e;color:#fff;padding:12px 22px;border:2px solid '+(e?'#c62828':'#b58c52')+';font-size:14px;z-index:99999;text-align:center;opacity:0;transition:.2s;pointer-events:none;width:70%;max-width:300px;font-weight:bold;border-radius:4px';document.body.appendChild(t);setTimeout(function(){t.style.opacity="1";},10);setTimeout(function(){t.style.opacity="0";setTimeout(function(){t.remove();},300);},1100);}  
  
function askName(){om("给你的角色起个名字",'<div style="text-align:center"><p style="font-size:13px;color:#555;margin-bottom:10px">十七岁的你，继承了濒临倒闭的牛郎俱乐部「夜莺」。<br>还有一笔五千万的高利贷。</p><input id="pn" class="ib" placeholder="请输入你的名字" maxlength="10" onkeydown="if(event.key===\'Enter\')saveName()"><div class="mb2 p" style="margin-top:15px" onclick="saveName()">下一步</div></div>');}  
function saveName(){var el=$("pn"),v=el?el.value.trim():"";if(!v)return toast("名字不能为空！",1);st.playerName=v;cm();setTimeout(askPer,200);}  
function askPer(){om("选择性格",'<div style="text-align:center"><p style="font-size:13px;color:#555;margin-bottom:15px">你的性格将影响员工对你的态度：</p><div class="mbl"><div class="mb2" onclick="savePer(\'懦弱\')">😳 懦弱（忠诚↑ PUA↑ 索财↓）</div><div class="mb2" onclick="savePer(\'精明\')">🧠 精明（索财↑ 好感↓）</div><div class="mb2" onclick="savePer(\'高冷\')">🥶 高冷（忠诚↑ 索财↑ PUA↓）</div><div class="mb2" onclick="savePer(\'温柔\')">🌷 温柔（好感↑ 忠诚↑ 索财↓）</div></div></div>');}  
function savePer(p){st.playerPersonality=p;cm();log("["+st.date+"] 你以【"+st.playerName+"】的身份接手了夜莺俱乐部，性格：【"+p+"】。","gd");render();toast("欢迎，"+st.playerName+"！");setTimeout(prologue,300);}  
  
var MAIN=[  
{id:"p",title:"第一章 · 继承之夜",cond:function(){return !st.prologueDone;},text:"深夜，霓虹街的雨下个不停。\n\n你攥着那份泛黄的转让契约，站在「夜莺俱乐部」的霓虹招牌下。三天前，你唯一的亲人——经营这家牛郎店的姑妈，留下这间店和五千万的高利贷，永远闭上了眼。你只有十七岁。\n\n推开门，昏暗的大厅里酒气未散。三名男员工围了上来，为首的【{ex}】愣在原地，随即快步走到你面前，眼眶泛红：\"你来了……我就知道你会来。\"\n\n他是你的前男友。两年前你们分手，他离家出走，成了这家店最红的牛郎。如今他眼里有千言万语，却只低声说：\"我会帮你。\"\n\n话音刚落，店门被一脚踹开。\n\n一个叼着雪茄、戴着金链的男人带着四个打手走进来——【{cr}】，放高利贷的债主。他把一沓借据拍在吧台上：\"小丫头，你姑妈欠我的钱，连本带利五千万。我给你两条路——要么还钱，要么，把这间店、还有你自己，都抵给我。\"\n\n【{ex}】把你护在身后，声音发冷：\"她还小。钱，我来还。\"\n\n{cr}哈哈大笑：\"你一个卖笑的牛郎，拿什么还？\"",opts:[  
  {t:"🔥 挺直腰板立下军令状：六个月连本带利还清！",e:function(){st.deadlineWeek=18;st.interestRate=0.02;st.heat+=10;st.flags.respect=true;var ex=exBF();if(ex){ex.loyalty=Math.min(100,ex.loyalty+10);ex.favor=Math.min(100,ex.favor+5);mem(ex,"被你的骨气打动，对你刮目相看");}log("[主线] 你立下军令状：六个月内还清所有债务。"+st.creditor+"眯起眼，第一次正眼看你。","gd");st.staff.forEach(function(s){s.mental=Math.min(100,s.mental+3);});}},  
  {t:"🥺 低声下气，求{cr}再宽限些……",e:function(){st.deadlineWeek=27;st.interestRate=0.03;st.reputation-=5;var ex=exBF();if(ex){ex.favor=Math.min(100,ex.favor+8);ex.mental=Math.min(100,ex.mental+12);mem(ex,"看着你被羞辱，心如刀割，保护欲疯长");}log("[主线] 你低声下气换来九个月期限，但利息涨到三成。员工们看在眼里，有人心疼，有人失望。","rd");}},  
  {t:"💔 看向【{ex}】：……帮帮我。",e:function(){st.interestRate=0.025;st.deadlineWeek=18;st.flags.exShield=true;var ex=exBF();if(ex){ex.obsession=Math.min(100,ex.obsession+20);ex.favor=Math.min(100,ex.favor+10);ex.mental=Math.min(100,ex.mental+10);mem(ex,"为你签下连带保证，心甘情愿陪你下地狱");}log("[主线] 承欢为你挡在债主面前，签下连带保证。他说：\"要还，一起还。\"","gd");}}

{id:"c1",title:"第二章 · 债主通牒",cond:function(){return st.weekCount>=4;},text:"本旬刚开始，四个黑衣打手就堵在了夜莺俱乐部门口。为首的光头把一张纸条拍进你手心，上面是{cr}的字迹：\n\n\"小丫头，第一期利息到期了。本息共 {debt} 万，你打算怎么还？\"\n\n店里瞬间安静下来，客人们窃窃私语，员工们紧张地看向你。【{ex}】不动声色地站到你身后，手已经按在了吧台下的酒瓶上。",opts:[

function openDiary(id) {  
  var s = st.staff.find(function(x){return x.id===id;});  
  if(!s) return;  
    
  var isCrazy = s.favor >= 95 && s.loyalty <= 90;  
    
  if (isCrazy) {

function playCrazyText(s, isFatal) {  
  var screen = document.createElement('div');  
  screen.className = 'flash-screen';  
  screen.style.display = 'block';  
  document.body.appendChild(screen);  
    
  var text = isFatal ? "不要离开我" : "我爱你";  
  for (var i = 0; i < 60; i++) {  
    var span = document.createElement('span');  
    span.className = 'flash-text';  
    span.innerText = text;  
    span.style.left = Math.random() * 90 + '%';  
    span.style.top = Math.random() * 90 + '%';  
    span.style.fontSize = (Math.random() * 20 + 14) + 'px';  
    span.style.transform = 'rotate(' + (Math.random() * 90 - 45) + 'deg)';  
    span.style.animationDelay = (Math.random() * 0.2) + 's';  
    screen.appendChild(span);

    setTimeout(function() {  
      screen.remove();  
      localStorage.removeItem("ng_auto");

function doCare(id){

  if(st.ap<=0) return toast("行动点不足！",1);

  if(!s) return;

  toast("好感+"+i+"，痴狂度-"+od);

function endWeek(){  
  if(st.gameOver)return;if(st.ap>0)toast("行动点未用完，强制结算",1);st._lastActs=[].concat(st.weekActions);st.weekCount++;  
  var m=st.date.match(/(\d+)月/);var mo=m?parseInt(m[1]):3;  
  if(st.date.indexOf("上旬")!==-1)st.date=st.date.replace("上旬","中旬");else if(st.date.indexOf("中旬")!==-1)st.date=st.date.replace("中旬","下旬");  
  else{mo=mo+1;if(mo>12){mo=1;var y=st.date.match(/第(\d+)年/);if(y)st.date=st.date.replace(/第\d+年/,"第"+(parseInt(y[1])+1)+"年");}st.date=st.date.replace(/\d+月/,mo+"月").replace("下旬","上旬");}  
  if(mo>=3&&mo<=5)st.season="春季";else if(mo>=6&&mo<=8)st.season="夏季";else if(mo>=9&&mo<=11)st.season="秋季";else st.season="冬季";  
  var interest=Math.floor(st.debt*st.interestRate);if(st.debt>0){st.debt+=interest;log("[利息] 高利贷利息滚动：+"+interest+"万（当前 "+st.debt+"万）。","rd");}  
  st.heat=Math.max(0,st.heat-5);var hd=0;  
  if(st.weekCount>1){if(!st.hasRested){st.noRestWeeks++;if(st.health<70)hd=5+Math.floor(Math.random()*10);else if(st.noRestWeeks>=3)hd=10+Math.floor(Math.random()*15);else if(Math.random()<0.3)hd=3+Math.floor(Math.random()*5);}else st.noRestWeeks=0;}  
  if(hd>0){st.health=Math.max(0,st.health-hd);log("[警告] 身体机能下降，健康-"+hd+"。","rd");if(st.health<=0){gameOver("你因为长期过劳，身体彻底垮掉了。");return;}}  
  st.hasRested=false;var rem=[];  
  st.staff.forEach(function(s){  
    if(s.status==="培训中"){var ai=5+Math.floor(Math.random()*6);s.ability=Math.min(100,s.ability+ai);s.status="在岗";mem(s,"培训归来，能力+"+ai);log("["+st.date+"] 【"+s.name+"】培训结束，能力+"+ai+"(当前"+s.ability+")","gd");}  
    var we=20+st.shopLevel*10+Math.floor(s.ability*0.3+s.face*0.2+st.heat*0.1+Math.random()*30);s.money+=we;  
    if(s.favor>=100)s.obsession=Math.min(100,(s.obsession||0)+2);if(s.favor>=90)s.loyalty=Math.min(100,s.loyalty+2);  
    if(s.mental>50&&s.favor<30&&s.loyalty<30){rem.push(s.id);log("["+st.date+"] 【"+s.name+"】因长期高压离职。","rd");}  
    else if(s.favor>=100&&s.obsession>=70&&s.mental>=60){triggerEnd(s);return;}  
  });  
  if(st.gameOver)return;if(rem.length)st.staff=st.staff.filter(function(s){return rem.indexOf(s.id)===-1;});  
  var rem2=[];st.staff.forEach(function(s){if(s.role==="前男友")return;if(s.loyalty<30&&s.status!=="培训中"){if(s.face>=85||s.ability>=85){if(Math.random()<0.5){log("[危机] 同行挖角！【"+s.name+"】被挖走了。","rd");rem2.push(s.id);}else{log("[危机] 【"+s.name+"】主动辞职。","rd");rem2.push(s.id);}}else log("[警告] 【"+s.name+"】忠诚度过低，有离职风险。","rd");}});  
  if(rem2.length)st.staff=st.staff.filter(function(s){return rem2.indexOf(s.id)===-1;});  
  var cc=Math.floor(12*(1+st.heat/100)),aa=st.staff.length>0?st.staff.reduce(function(a,b){return a+b.ability;},0)/st.staff.length:0,asp=Math.floor(30*(1+st.reputation/100)*(1+aa/200)*(1+(st.shopLevel-1)*0.25));var inc=cc*asp,lu=cc*0.5;  
  if(st.liquor<=0){inc=0;log("[危机] 酒水耗尽！本旬收益为0！","rd");}else if(st.liquor<lu){st.liquor=0;log("[警告] 酒水不足，仅能满足部分客人。","rd");}else st.liquor-=Math.floor(lu);  
  var exp=150+st.shopLevel*80,np=inc-exp;st.cash+=np;st.ap=st.maxAp;  
  log("—— 第 "+st.weekCount+" 旬 · 结算 ——","gd");log("客流："+cc+"人 | 客单价："+asp+"万 | 酒水消耗："+Math.floor(lu)+"瓶","gy");log("本旬收入："+inc+"万 | 支出："+exp+"万 | 净利润："+(np>=0?"+":"")+np+"万","gy");  
  weeklySummary();render();if(st.cash<=0){gameOver();return;}save();weeklyStory();  
}

function doLoadSlot(i){try{var d=JSON.parse(localStorage.getItem("ng_slot_"+i));if(d&&d.state){Object.keys(st).forEach(function(k){if(d.state[k]!==undefined)st[k]=d.state[k]});norm();cm();render();toast("读档成功！欢迎回来，"+st.playerName+"！");return}}catch(e){}toast("该存档位为空",1);}  
function exportSave(){var d=JSON.stringify({state:st,time:Date.now()});om("导出存档",'<p style="font-size:12px;color:#555;margin-bottom:8px">复制下方代码保存到记事本，即可备份游戏进度：</p><textarea class="ta" id="saveText" readonly onclick="this.select()">'+d.replace(/</g,"&lt;")+'</textarea><div class="mbl" style="margin-top:10px"><div class="mb2 p" onclick="copySave()">一键复制</div><div class="mb2" onclick="cm()">完成</div></div>');}  
function copySave(){var t=$("saveText");t.select();try{document.execCommand("copy");toast("已复制到剪贴板")}catch(e){toast("请手动全选复制",1)}}  
function importSave(){om("导入存档",'<p style="font-size:12px;color:#555;margin-bottom:8px">粘贴之前导出的存档代码：</p><textarea class="ta" id="loadText" placeholder="在此粘贴存档代码"></textarea><div class="mbl" style="margin-top:10px"><div class="mb2 p" onclick="applyImport()">导入</div><div class="mb2" onclick="cm()">取消</div></div>');}  
function applyImport(){var v=$("loadText").value.trim();if(!v)return toast("请先粘贴代码",1);try{var d=JSON.parse(v.replace(/&lt;/g,"<").replace(/&gt;/g,">"));if(d&&d.state){Object.keys(st).forEach(function(k){if(d.state[k]!==undefined)st[k]=d.state[k]});norm();cm();render();toast("导入成功！");}}catch(e){toast("存档格式错误",1)}}  
  
function confirmReset() {  
  om("确认重开", '<div style="text-align:center"><p style="font-size:14px;color:#c62828;font-weight:bold;margin-bottom:15px">确定要重新开始吗？<br>当前所有进度将丢失！</p><div class="mbl"><div class="mb2 d" onclick="doReset()">狠心重开</div><div class="mb2" onclick="cm()">取消</div></div></div>');  
}  
  
function doReset() {  
  // 只清空自动存档，保留手动存档  
  localStorage.removeItem("ng_auto");  
    
  // 重置核心数据  
  st.playerName = "";  
  st.playerPersonality = "";  
  st.date = "第1年 3月 上旬";  
  st.season = "春季";  
  st.shopLevel = 1;  
  st.shopLevelName = "⭐";  
  st.heat = 0;  
  st.reputation = 0;  
  st.liquor = 20;  
  st.health = 100;  
  st.consecutiveActions = 0;  
  st.hasRested = false;  
  st.weekCount = 1;  
  st.noRestWeeks = 0;  
  st.exploreCount = 0;  
  st.cash = 500;  
  st.debt = 5000;  
  st.interestRate = 0.02;  
  st.deadlineWeek = 18;  
  st.ap = 7;  
  st.maxAp = 7;  
  st.tab = "home";  
  st.npc = null;  
  st.gameOver = false;  
  st.prologueDone = false;  
  st.storyPlayed = [];  
  st.weekActions = [];  
  st._lastActs = [];  
  st.flags = {};  
  st.creditor = "金爷";  
    
  // 重新生成基础员工  
  initStaff();  
    
  // 关弹窗并清空事迹记录  
  cm();  
  document.getElementById("log").innerHTML = "";  
    
  // 重新渲染并呼出起名界面  
  render();  
  askName();  
}  
  
function bindEvents(){  
  $("be").onclick=endWeek;  
  $("bs").onclick=saveMenu;  
  $("br").onclick=confirmReset;  
  $("mc").onclick=cm;  
  $("bn").addEventListener("click",function(e){var btn=e.target.closest(".nb");if(btn){st.tab=btn.dataset.tab;render();}});  
  $("tab").addEventListener("click",function(e){var ac=e.target.closest(".ac");if(ac&&!ac.classList.contains("tr")){action(ac.dataset.id);}});  
}  
  
window.onload=function(){  
  bindEvents();  
  initStaff();  
  norm();  
  try{  
    var auto=localStorage.getItem("ng_auto");  
    if(auto){  
      var d=JSON.parse(auto);  
      if(d&&d.state&&d.state.playerName&&Array.isArray(d.state.staff)&&d.state.staff.length>0){  
        Object.keys(st).forEach(function(k){if(d.state[k]!==undefined)st[k]=d.state[k]});  
        norm();render();  
      }else{  
        localStorage.removeItem("ng_auto");askName();  
      }  
    }else{askName();}  
  }catch(e){localStorage.removeItem("ng_auto");askName();}  
  render();  
};  
</script>  
</body>  
</html>
